<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hearings Management - Legal Court Case Tracking System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="app-wrapper">
    <nav id="sidebar"></nav>

    <div id="main-content">
      <header id="top-navbar"></header>

      <main id="page-content">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <h2 class="h3 mb-0 text-primary-gov">Hearings Management</h2>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="dashboard.html">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Hearings</li>
              </ol>
            </nav>
          </div>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addHearingModal">
            <i class="bi bi-plus-circle me-1"></i> Update Hearing Details
          </button>
        </div>

        <div class="row g-4">
          <!-- Main Table List -->
          <div class="col-xl-8 col-lg-7">
            <!-- Filters -->
            <div class="card bg-surface border-0 shadow-sm mb-4">
              <div class="card-body">
                <div class="row g-2">
                  <div class="col-md-4">
                    <div class="input-group input-group-sm">
                      <span class="input-group-text bg-transparent"><i class="bi bi-search"></i></span>
                      <input type="text" class="form-control" id="searchHearing" placeholder="Search FIR No...">
                    </div>
                  </div>
                  <div class="col-md-3">
                    <input type="date" class="form-control form-control-sm" id="filterDate">
                  </div>
                  <div class="col-md-3">
                    <select class="form-select form-select-sm" id="filterCourtStatus">
                      <option value="">All Statuses</option>
                      <option value="Adjourned">Adjourned</option>
                      <option value="Affidavit Required">Affidavit Required</option>
                      <option value="Evidence Required">Evidence Required</option>
                      <option value="Order Reserved">Order Reserved</option>
                      <option value="Final Hearing">Final Hearing</option>
                      <option value="Compliance Pending">Compliance Pending</option>
                    </select>
                  </div>
                  <div class="col-md-2 text-end">
                    <button class="btn btn-sm btn-outline-secondary w-100" id="resetFilters">Reset</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Data Table -->
            <div class="card bg-surface border-0 shadow-sm">
              <div class="card-body p-0">
                <div class="table-responsive m-0">
                  <table class="table table-hover align-middle mb-0">
                    <thead>
                      <tr>
                        <th>FIR Number</th>
                        <th>Accused</th>
                        <th>Court</th>
                        <th>Hearing Date</th>
                        <th>Next Date</th>
                        <th>Court Status</th>
                        <th>Updated By</th>
                        <th class="text-end">Actions</th>
                      </tr>
                    </thead>
                    <tbody id="hearings-tbody">
                      <!-- Populated via JS -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          <!-- Sidebar Timeline for Selected FIR -->
          <div class="col-xl-4 col-lg-5">
            <div class="card bg-surface border-0 shadow-sm h-100 sticky-top" style="top: 20px;">
              <div class="card-header bg-transparent border-bottom pt-3">
                <h6 class="card-title mb-0" id="timeline-title">Hearing History Timeline</h6>
                <small class="text-muted" id="timeline-subtitle">Select a hearing to view history</small>
              </div>
              <div class="card-body" style="max-height: 70vh; overflow-y: auto;">
                <ul class="timeline m-0" id="hearing-timeline">
                  <!-- Populated via JS -->
                  <div class="text-center text-muted py-5">
                    <i class="bi bi-clock-history fs-1 mb-2"></i>
                    <p>No FIR selected</p>
                  </div>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </main>
      
      <div id="footer-container"></div>
    </div>
  </div>

  <!-- Add Hearing Modal -->
  <div class="modal fade" id="addHearingModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content bg-surface text-main border-0">
        <div class="modal-header border-bottom">
          <h5 class="modal-title">Record Hearing Update</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="addHearingForm">
            <div class="row g-3">
              <div class="col-md-12">
                <label class="form-label required-label">Select FIR</label>
                <select class="form-select" id="firSelect" required>
                  <!-- Populated dynamically -->
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label required-label">Hearing Date</label>
                <input type="date" class="form-control" id="hearingDate" required>
              </div>
              
              <div class="col-md-6">
                <label class="form-label">Next Hearing Date</label>
                <input type="date" class="form-control" id="nextDate">
                <small class="text-muted">Leave empty if case closed/reserved</small>
              </div>
              
              <div class="col-md-6">
                <label class="form-label required-label">Court Status</label>
                <select class="form-select" id="courtStatus" required>
                  <option value="">Select Status</option>
                  <option value="Adjourned">Adjourned</option>
                  <option value="Affidavit Required">Affidavit Required</option>
                  <option value="Evidence Required">Evidence Required</option>
                  <option value="Order Reserved">Order Reserved</option>
                  <option value="Final Hearing">Final Hearing</option>
                  <option value="Compliance Pending">Compliance Pending</option>
                </select>
              </div>
              
              <div class="col-md-6">
                <label class="form-label">Generate Alert for IO?</label>
                <div class="form-check form-switch mt-2">
                  <input class="form-check-input" type="checkbox" id="generateAlert">
                  <label class="form-check-label" for="generateAlert">Yes, create pending alert task</label>
                </div>
              </div>
              
              <div class="col-12">
                <label class="form-label required-label">Court Remarks / Orders</label>
                <textarea class="form-control" id="remarks" rows="4" required placeholder="Enter precise details of what transpired in court..."></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer border-top">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveHearingBtn" onclick="saveHearing()">Save Update</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/hearings.js"></script>
</body>
</html>
