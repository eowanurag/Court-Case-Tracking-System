<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Management - Legal Court Case Tracking System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="app-wrapper">
    <nav id="sidebar"></nav>

    <div id="main-content">
      <header id="top-navbar"></header>

      <main id="page-content">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <h2 class="h3 mb-0 text-primary-gov">Document Management</h2>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="dashboard.html">Home</a></li>
                <li class="breadcrumb-item"><a href="fir.html">FIR Cases</a></li>
                <li class="breadcrumb-item active" aria-current="page">Documents</li>
              </ol>
            </nav>
          </div>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#uploadDocModal">
            <i class="bi bi-cloud-upload me-1"></i> Upload Court Order/Photo
          </button>
        </div>

        <!-- Documents Grid -->
        <div class="row g-4" id="documents-grid">
          <!-- Populated via JS -->
          <div class="col-12 text-center py-5 text-muted">
            <div class="spinner-border text-primary mb-3"></div>
            <p>Loading documents...</p>
          </div>
        </div>
      </main>
      
      <div id="footer-container"></div>
    </div>
  </div>

  <!-- Upload Document Modal -->
  <div class="modal fade" id="uploadDocModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content bg-surface text-main border-0">
        <div class="modal-header border-bottom">
          <h5 class="modal-title">Upload Case Document</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="uploadDocForm">
            <div class="row g-3">
              <div class="col-md-12">
                <label class="form-label required-label">Select FIR</label>
                <select class="form-select" id="firSelect" required>
                  <!-- Populated dynamically -->
                </select>
              </div>

              <div class="col-md-12">
                <label class="form-label required-label">Document Type</label>
                <select class="form-select" id="docType" required>
                  <option value="">Select Type</option>
                  <option value="Court Order">Court Order</option>
                  <option value="Bail Order">Bail Order</option>
                  <option value="Stay Order">Stay Order</option>
                  <option value="Photo of Record">Photo of Record</option>
                  <option value="Affidavit">Affidavit</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              
              <div class="col-md-12">
                <label class="form-label required-label">Document Title</label>
                <input type="text" class="form-control" id="docTitle" placeholder="e.g. High Court Bail Order - 12 Jan 2026" required>
              </div>
              
              <div class="col-md-12">
                <label class="form-label required-label">File (PDF or Image)</label>
                <input type="file" class="form-control" id="docFile" accept=".pdf,.jpg,.jpeg,.png" required>
                <small class="text-muted">Max size: 5MB. Formats: PDF, JPG, PNG</small>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer border-top">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="uploadBtn" onclick="uploadDocument()">Upload Now</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/documents.js"></script>
</body>
</html>
