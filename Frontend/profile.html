<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Settings - Legal Court Case Tracking System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="app-wrapper">
    <nav id="sidebar"></nav>

    <div id="main-content">
      <header id="top-navbar"></header>

      <main id="page-content">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <h2 class="h3 mb-0 text-primary-gov">Profile Settings</h2>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="dashboard.html">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Profile</li>
              </ol>
            </nav>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-md-4">
            <div class="card bg-surface border-0 shadow-sm text-center p-4">
              <i class="bi bi-person-circle text-primary mb-3" style="font-size: 5rem;"></i>
              <h4 class="mb-1" id="profileName">User Name</h4>
              <p class="text-muted mb-3" id="profileRole">Role</p>
              <button class="btn btn-outline-primary btn-sm mb-2 w-100">Change Photo</button>
            </div>
          </div>
          
          <div class="col-md-8">
            <div class="card bg-surface border-0 shadow-sm mb-4">
              <div class="card-header bg-transparent border-bottom pt-3">
                <h5 class="mb-0">Personal Information</h5>
              </div>
              <div class="card-body">
                <form id="profileForm">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label">Full Name</label>
                      <input type="text" class="form-control" id="inputName">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Email Address</label>
                      <input type="email" class="form-control" id="inputEmail" readonly>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Phone Number</label>
                      <input type="text" class="form-control" placeholder="+91 98765 43210">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Assigned Sector</label>
                      <input type="text" class="form-control" value="Headquater" readonly>
                    </div>
                    <div class="col-12 mt-4 text-end">
                      <button type="button" class="btn btn-primary" onclick="App.showToast('Profile updated successfully!')">Save Changes</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>

            <div class="card bg-surface border-0 shadow-sm">
              <div class="card-header bg-transparent border-bottom pt-3">
                <h5 class="mb-0">Security Settings</h5>
              </div>
              <div class="card-body">
                <form>
                  <div class="row g-3">
                    <div class="col-md-12">
                      <label class="form-label">Current Password</label>
                      <input type="password" class="form-control">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">New Password</label>
                      <input type="password" class="form-control">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Confirm New Password</label>
                      <input type="password" class="form-control">
                    </div>
                    <div class="col-12 mt-4 text-end">
                      <button type="button" class="btn btn-outline-primary" onclick="App.showToast('Password changed successfully!')">Change Password</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

      </main>
      
      <div id="footer-container"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    function pageInit() {
      const user = JSON.parse(localStorage.getItem('eow_user') || '{}');
      if(user.name) {
        document.getElementById('profileName').innerText = user.name;
        document.getElementById('inputName').value = user.name;
      }
      if(user.role) {
        document.getElementById('profileRole').innerText = user.role;
      }
      if(user.email) {
        document.getElementById('inputEmail').value = user.email;
      }
    }
  </script>
</body>
</html>
