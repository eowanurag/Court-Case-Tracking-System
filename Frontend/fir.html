<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIR Cases - Legal Court Case Tracking System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="app-wrapper">
    <nav id="sidebar"></nav>

    <div id="main-content">
      <header id="top-navbar"></header>

      <main id="page-content">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <h2 class="h3 mb-0 text-primary-gov">FIR Cases</h2>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="dashboard.html">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">FIR Cases</li>
              </ol>
            </nav>
          </div>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addFIRModal">
            <i class="bi bi-plus-circle me-1"></i> Add FIR
          </button>
        </div>

        <!-- Filters -->
        <div class="card bg-surface border-0 shadow-sm mb-4">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-4">
                <div class="input-group">
                  <span class="input-group-text bg-transparent"><i class="bi bi-search"></i></span>
                  <input type="text" class="form-control" id="searchFIR" placeholder="Search FIR No. or Court">
                </div>
              </div>
              <div class="col-md-3">
                <select class="form-select" id="filterDistrict">
                  <option value="">All Districts</option>
                  <option value="Varanasi">Varanasi</option>
                  <option value="Lucknow">Lucknow</option>
                  <option value="Kanpur">Kanpur</option>
                </select>
              </div>
              <div class="col-md-3">
                <select class="form-select" id="filterStatus">
                  <option value="">All Statuses</option>
                  <option value="Investigation">Investigation</option>
                  <option value="Under Trial">Under Trial</option>
                  <option value="Closed">Closed</option>
                </select>
              </div>
              <div class="col-md-2 d-flex align-items-center">
                <div class="form-check form-switch pairokar-only admin-only supervisor-only" style="display: none;">
                  <input class="form-check-input" type="checkbox" id="showAllToggle">
                  <label class="form-check-label small ms-1" for="showAllToggle">Show All</label>
                </div>
              </div>
              <div class="col-md-2 text-end">
                <button class="btn btn-outline-secondary w-100" id="resetFilters">Reset</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Data Table -->
        <div class="card bg-surface border-0 shadow-sm">
          <div class="card-body p-0">
            <div class="table-responsive m-0">
              <table class="table table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th>FIR Details</th>
                    <th>Police Station</th>
                    <th>Court Name</th>
                    <th>Investigation Number</th>
                    <th>Accused</th>
                    <th>Next Hearing</th>
                    <th>Current Status</th>
                    <th>पैरोकार</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="fir-tbody">
                  <!-- Populated via JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
      
      <div id="footer-container"></div>
    </div>
  </div>

  <!-- Add FIR Modal -->
  <div class="modal fade" id="addFIRModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content bg-surface text-main border-0">
        <div class="modal-header border-bottom">
          <h5 class="modal-title">Add New FIR</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="addFIRForm">
            <div class="row g-3">
              <div class="col-md-12">
                <label class="form-label required-label">Link to Investigation File</label>
                <select class="form-select" id="fileSelect" required>
                  <!-- Populated dynamically -->
                </select>
              </div>

              <div class="col-md-12">
                <label class="form-label">Assign पैरोकार (Pairokar)</label>
                <select class="form-select" id="pairokarsSelect">
                  <option value="">-- Select Pairokar (Optional) --</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label required-label">FIR Number</label>
                <input type="text" class="form-control" id="firNo" required>
              </div>
              <div class="col-md-4">
                <label class="form-label required-label">FIR Year</label>
                <input type="number" class="form-control" id="firYear" value="2026" required>
              </div>
              <div class="col-md-4">
                <label class="form-label required-label">District</label>
                <select class="form-select" id="district" required>
                  <option value="">Select District</option>
                  <option value="Varanasi">Varanasi</option>
                  <option value="Lucknow">Lucknow</option>
                  <option value="Kanpur">Kanpur</option>
                </select>
              </div>
              
              <div class="col-md-12">
                <label class="form-label">Auto-generated FIR Reference</label>
                <input type="text" class="form-control bg-light fw-bold text-primary" id="fullFIRNumber" readonly>
                <small class="text-muted">Format: Number/Year - District</small>
              </div>
              
              <div class="col-md-4">
                <label class="form-label required-label">Police Station</label>
                <input type="text" class="form-control" id="ps" required>
              </div>
              <div class="col-md-4">
                <label class="form-label required-label">Court Name</label>
                <input type="text" class="form-control" id="court" required>
              </div>
              <div class="col-md-4">
                <label class="form-label required-label">Current Status</label>
                <select class="form-select" id="status" required>
                  <option value="Investigation" selected>Investigation</option>
                  <option value="Under Trial">Under Trial</option>
                  <option value="Closed">Closed</option>
                </select>
              </div>
              <div class="col-md-12">
                <label class="form-label">Accused Name(s)</label>
                <input type="text" class="form-control" id="accusedNames" placeholder="Single or multiple names">
              </div>
              <div class="col-md-6">
                <label class="form-label">Court Case Type</label>
                <input type="text" class="form-control" id="courtCaseType" placeholder="e.g. Bail, Criminal, etc.">
              </div>
              <div class="col-md-6">
                <label class="form-label">Case Initial Date</label>
                <input type="date" class="form-control" id="caseInitialDate">
              </div>
              <div class="col-md-4">
                <label class="form-label">Last Hearing Date</label>
                <input type="date" class="form-control" id="lastHearingDate">
              </div>
              <div class="col-md-4">
                <label class="form-label">Date Order Sent</label>
                <input type="date" class="form-control" id="orderSentDate">
              </div>
              <div class="col-md-4">
                <label class="form-label">Due Date</label>
                <input type="date" class="form-control" id="dueDate">
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer border-top">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveFIRBtn" onclick="saveFIR()">Save FIR</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit FIR Modal -->
  <div class="modal fade" id="editFIRModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content bg-surface text-main border-0">
        <div class="modal-header border-bottom">
          <h5 class="modal-title">Edit FIR</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editFIRId">
          <form id="editFIRForm">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label required-label">Police Station</label>
                <input type="text" class="form-control" id="editPs" required>
              </div>
              <div class="col-md-4">
                <label class="form-label required-label">Court Name</label>
                <input type="text" class="form-control" id="editCourt" required>
              </div>
              <div class="col-md-4">
                <label class="form-label required-label">Current Status</label>
                <select class="form-select" id="editStatus" required>
                  <option value="Investigation">Investigation</option>
                  <option value="Under Trial">Under Trial</option>
                  <option value="Closed">Closed</option>
                </select>
              </div>
              <div class="col-md-12">
                <label class="form-label">Assign पैरोकार (Pairokar)</label>
                <select class="form-select" id="editPairokarSelect">
                  <option value="">-- None --</option>
                </select>
              </div>
              <div class="col-md-12">
                <label class="form-label">Accused Name(s)</label>
                <input type="text" class="form-control" id="editAccusedNames">
              </div>
              <div class="col-md-6">
                <label class="form-label">Court Case Type</label>
                <input type="text" class="form-control" id="editCourtCaseType">
              </div>
              <div class="col-md-6">
                <label class="form-label">Case Initial Date</label>
                <input type="date" class="form-control" id="editCaseInitialDate">
              </div>
              <div class="col-md-4">
                <label class="form-label">Last Hearing Date</label>
                <input type="date" class="form-control" id="editLastHearingDate">
              </div>
              <div class="col-md-4">
                <label class="form-label">Date Order Sent</label>
                <input type="date" class="form-control" id="editOrderSentDate">
              </div>
              <div class="col-md-4">
                <label class="form-label">Due Date</label>
                <input type="date" class="form-control" id="editDueDate">
              </div>
              <div class="col-md-12">
                <label class="form-label">Remarks</label>
                <textarea class="form-control" id="editRemarks" rows="2"></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer border-top">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="updateFIRBtn" onclick="updateFIR()">Update FIR</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/fir.js"></script>
</body>
</html>
