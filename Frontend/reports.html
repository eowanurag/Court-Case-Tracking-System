<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - Legal Court Case Tracking System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-report, #printable-report * { visibility: visible; }
      #printable-report { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

  <div id="app-wrapper">
    <nav id="sidebar"></nav>

    <div id="main-content">
      <header id="top-navbar"></header>

      <main id="page-content">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <h2 class="h3 mb-0 text-primary-gov">Generate Reports</h2>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="dashboard.html">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Reports</li>
              </ol>
            </nav>
          </div>
          <div class="btn-group no-print">
            <button class="btn btn-outline-primary" onclick="window.print()"><i class="bi bi-printer"></i> Print</button>
            <button class="btn btn-primary" onclick="exportReport()"><i class="bi bi-file-earmark-excel"></i> Export Excel</button>
          </div>
        </div>

        <!-- Report Generation Filters -->
        <div class="card bg-surface border-0 shadow-sm mb-4 no-print">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label text-muted small">Report Type</label>
                <select class="form-select" id="reportType">
                  <option value="daily_hearings">Daily Hearing Report</option>
                  <option value="upcoming_hearings">Upcoming Hearings Report</option>
                  <option value="pending_compliance">Pending Compliance Report</option>
                  <option value="sector_wise">Sector-wise Status Report</option>
                  <option value="io_report">Investigation Officer Report</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label text-muted small">Date From</label>
                <input type="date" class="form-control" id="dateFrom">
              </div>
              <div class="col-md-3">
                <label class="form-label text-muted small">Date To</label>
                <input type="date" class="form-control" id="dateTo">
              </div>
              <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-primary w-100" id="generateReportBtn">Generate</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Printable Report Container -->
        <div class="card bg-surface border-0 shadow-sm" id="printable-report">
          <div class="card-body p-4">
            <div class="text-center mb-4 border-bottom pb-3">
              <h4 class="mb-1 text-primary-gov" id="report-title">Daily Hearing Report</h4>
              <p class="text-muted mb-0" id="report-subtitle">Generated on: <span id="current-date"></span></p>
            </div>
            
            <!-- Summary Cards embedded in report -->
            <div class="row g-3 mb-4" id="report-summary">
              <!-- Dynamically populated -->
            </div>
            
            <div class="table-responsive">
              <table class="table table-bordered table-striped mb-0">
                <thead class="table-light" id="report-thead">
                  <!-- Dynamically populated -->
                </thead>
                <tbody id="report-tbody">
                  <!-- Dynamically populated -->
                </tbody>
              </table>
            </div>
            
            <div class="mt-5 pt-3 border-top text-end no-print">
              <span class="text-muted small">End of Report</span>
            </div>
          </div>
        </div>
      </main>
      
      <div id="footer-container"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
