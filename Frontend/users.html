<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - Legal Court Case Tracking System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="app-wrapper">
    <nav id="sidebar"></nav>

    <div id="main-content">
      <header id="top-navbar"></header>

      <main id="page-content">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <h2 class="h3 mb-0 text-primary-gov">User Management</h2>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="dashboard.html">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Users</li>
              </ol>
            </nav>
          </div>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal" onclick="openUserModal('add')">
            <i class="bi bi-person-plus me-1"></i> Add New User
          </button>
        </div>

        <div class="card bg-surface border-0 shadow-sm">
          <div class="card-body p-0">
            <div class="table-responsive m-0">
              <table class="table table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Sector / Dept</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="users-tbody">
                  <!-- Populated via JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
      
      <div id="footer-container"></div>
    </div>
  </div>

  <!-- User Modal -->
  <div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content bg-surface text-main border-0">
        <div class="modal-header border-bottom">
          <h5 class="modal-title" id="userModalTitle">Add User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="userForm">
            <input type="hidden" id="userId">
            <div class="mb-3">
              <label class="form-label required-label">Full Name</label>
              <input type="text" class="form-control" id="userName" required>
            </div>
            <div class="mb-3">
              <label class="form-label required-label">Email Address</label>
              <input type="email" class="form-control" id="userEmail" required>
            </div>
            <div class="mb-3" id="passwordGroup">
              <label class="form-label">Temporary Password</label>
              <input type="password" class="form-control" id="userPassword">
            </div>
            <div class="mb-3">
              <label class="form-label required-label">Role</label>
              <select class="form-select" id="userRole" required>
                <option value="Admin">Admin</option>
                <option value="Supervisor">Supervisor</option>
                <option value="Legal Team">Legal Team</option>
                <option value="Court Tracking Staff">Court Tracking Staff</option>
                <option value="Investigation Officer">Investigation Officer</option>
                <option value="Pairokar">Pairokar (पैरोकार)</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label required-label">Assigned Sector / Dept</label>
              <select class="form-select" id="userSector" required>
                <option value="SSIT">SSIT</option>
                <option value="Special Cell">Special Cell</option>
                <option value="Lucknow">Lucknow</option>
                <option value="Kanpur">Kanpur</option>
                <option value="Meerut">Meerut</option>
                <option value="Varanasi">Varanasi</option>
                <option value="Headquater">Headquater</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Status</label>
              <select class="form-select" id="userStatus">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer border-top">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveUserBtn" onclick="saveUser()">Save User</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Reset Password Modal -->
  <div class="modal fade" id="resetPasswordModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
      <div class="modal-content bg-surface text-main border-0">
        <div class="modal-header border-bottom">
          <h5 class="modal-title">Reset Password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="resetPassUserId">
          <div class="mb-3">
            <label class="form-label required-label">New Password</label>
            <input type="password" class="form-control" id="newPassword" required>
          </div>
          <div class="mb-3">
            <label class="form-label required-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" required>
          </div>
        </div>
        <div class="modal-footer border-top">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" onclick="confirmResetPassword()">Reset Now</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
