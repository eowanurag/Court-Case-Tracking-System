<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerts & Actions - Legal Court Case Tracking System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="app-wrapper">
    <nav id="sidebar"></nav>

    <div id="main-content">
      <header id="top-navbar"></header>

      <main id="page-content">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <h2 class="h3 mb-0 text-primary-gov">Actionable Alerts</h2>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="dashboard.html">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Alerts</li>
              </ol>
            </nav>
          </div>
        </div>

        <!-- Filters -->
        <div class="card bg-surface border-0 shadow-sm mb-4">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-3">
                <select class="form-select" id="filterStatus">
                  <option value="Pending" selected>Pending</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Completed">Completed</option>
                  <option value="">All Statuses</option>
                </select>
              </div>
              <div class="col-md-3">
                <select class="form-select" id="filterPriority">
                  <option value="">All Priorities</option>
                  <option value="High">High</option>
                  <option value="Medium">Medium</option>
                  <option value="Low">Low</option>
                </select>
              </div>
              <div class="col-md-4">
                <div class="input-group">
                  <span class="input-group-text bg-transparent"><i class="bi bi-search"></i></span>
                  <input type="text" class="form-control" id="searchAlert" placeholder="Search by FIR or IO">
                </div>
              </div>
              <div class="col-md-2 text-end">
                <button class="btn btn-outline-secondary w-100" id="resetFilters">Reset</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Alerts Grid -->
        <div class="row g-4" id="alerts-container">
          <!-- Populated via JS -->
        </div>

      </main>
      
      <div id="footer-container"></div>
    </div>
  </div>

  <!-- Assign IO Modal -->
  <div class="modal fade" id="assignAlertModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content bg-surface text-main border-0">
        <div class="modal-header border-bottom">
          <h5 class="modal-title">Assign / Update Alert</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="assignAlertForm">
            <input type="hidden" id="alertId">
            <div class="mb-3">
              <label class="form-label">Assign to Investigation Officer</label>
              <select class="form-select" id="assignedTo" required>
                <option value="">Select IO</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Update Status</label>
              <select class="form-select" id="alertStatus" required onchange="toggleCompletionFields()">
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </div>
            <div class="mb-3" id="completionDateGroup" style="display: none;">
              <label class="form-label required-label">Completion Date</label>
              <input type="date" class="form-control" id="completionDate">
            </div>
            <div class="mb-3">
              <label class="form-label">Remarks / Progress Details</label>
              <textarea class="form-control" id="alertRemarks" rows="3" placeholder="Enter status update details, action items completed..."></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer border-top">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveAlertBtn" onclick="saveAlertUpdate()">Update Alert</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/alerts.js"></script>
</body>
</html>
