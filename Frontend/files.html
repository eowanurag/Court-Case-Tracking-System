<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investigation Files - Legal Court Case Tracking System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="app-wrapper">
    <nav id="sidebar"></nav>

    <div id="main-content">
      <header id="top-navbar"></header>

      <main id="page-content">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <h2 class="h3 mb-0 text-primary-gov">Investigation Files</h2>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="dashboard.html">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Files</li>
              </ol>
            </nav>
          </div>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addFileModal">
            <i class="bi bi-plus-circle me-1"></i> New File
          </button>
        </div>

        <!-- Filters -->
        <div class="card bg-surface border-0 shadow-sm mb-4">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-4">
                <div class="input-group">
                  <span class="input-group-text bg-transparent"><i class="bi bi-search"></i></span>
                  <input type="text" class="form-control" id="searchFile" placeholder="Search by File No. or IO">
                </div>
              </div>
              <div class="col-md-3">
                <select class="form-select" id="filterSector">
                  <option value="">All Sectors</option>
                  <option value="SSIT">SSIT</option>
                  <option value="Special Cell">Special Cell</option>
                  <option value="Lucknow">Lucknow</option>
                  <option value="Kanpur">Kanpur</option>
                  <option value="Meerut">Meerut</option>
                  <option value="Varanasi">Varanasi</option>
                  <option value="Headquater">Headquater</option>
                </select>
              </div>
              <div class="col-md-3">
                <select class="form-select" id="filterStatus">
                  <option value="">All Statuses</option>
                  <option value="Active">Active</option>
                  <option value="Closed">Closed</option>
                </select>
              </div>
              <div class="col-md-2 text-end">
                <button class="btn btn-outline-secondary w-100" id="resetFilters">Reset</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Data Table -->
        <div class="card bg-surface border-0 shadow-sm">
          <div class="card-body p-0">
            <div class="table-responsive m-0">
              <table class="table table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th>File Number</th>
                    <th>Sector Name</th>
                    <th>Investigation Officer</th>
                    <th>Total FIRs</th>
                    <th>Created Date</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="files-tbody">
                  <!-- Populated via JS -->
                </tbody>
              </table>
            </div>
            
            <!-- Pagination Mock -->
            <div class="d-flex justify-content-between align-items-center p-3 border-top">
              <span class="text-muted small">Showing 1 to <span id="showing-count">0</span> of <span id="total-count">0</span> entries</span>
              <ul class="pagination pagination-sm mb-0">
                <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">Next</a></li>
              </ul>
            </div>
          </div>
        </div>
      </main>
      
      <div id="footer-container"></div>
    </div>
  </div>

  <!-- Add File Modal -->
  <div class="modal fade" id="addFileModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content bg-surface text-main border-0">
        <div class="modal-header border-bottom">
          <h5 class="modal-title">Create New Investigation File</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="addFileForm">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label required-label">File Number</label>
                <input type="text" class="form-control" id="fileNo" required>
              </div>
              <div class="col-md-4">
                <label class="form-label required-label">File Year</label>
                <input type="number" class="form-control" id="fileYear" value="2026" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Full File Number</label>
                <input type="text" class="form-control bg-light" id="fullNumber" readonly>
              </div>
              
              <div class="col-md-6">
                <label class="form-label required-label">Sector Name</label>
                <select class="form-select" id="sector" required>
                  <option value="">Select Sector</option>
                  <option value="SSIT">SSIT</option>
                  <option value="Special Cell">Special Cell</option>
                  <option value="Lucknow">Lucknow</option>
                  <option value="Kanpur">Kanpur</option>
                  <option value="Meerut">Meerut</option>
                  <option value="Varanasi">Varanasi</option>
                  <option value="Headquater">Headquater</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Investigation Officer (Optional)</label>
                <select class="form-select" id="io">
                  <option value="">-- Not Assigned --</option>
                </select>
              </div>
              
              <div class="col-md-6">
                <label class="form-label">File Title (Optional)</label>
                <input type="text" class="form-control" id="title">
              </div>
              <div class="col-md-6">
                <label class="form-label required-label">Status</label>
                <select class="form-select" id="status" required>
                  <option value="Active" selected>Active</option>
                  <option value="Closed">Closed</option>
                </select>
              </div>
              
              <div class="col-12">
                <label class="form-label">Remarks</label>
                <textarea class="form-control" id="remarks" rows="2"></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer border-top">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveFileBtn" onclick="saveFile()">Save File</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/files.js"></script>
</body>
</html>
